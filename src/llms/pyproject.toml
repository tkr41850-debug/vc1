[project]
name = "zen-proxy"
version = "0.1.0"
description = "Local proxy accepting OpenAI Responses API and forwarding to Opencode Zen Responses API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.28",
]

[dependency-groups]
dev = [
  "openai>=1.0",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "B008", "S110"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S112"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proxy"]

services:
  gateway:
    build: .
    ports:
      - "${ZEN_GATEWAY_PORT:-8789}:8789"
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    # warp-svc needs a TUN device; NET_ADMIN lets it bring the interface up.
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
